# Name of the scenario to run
scenario: "scenario-1oz-2op"

# Path or list of paths in which look for sources (can be either relative to
# cwd or absolute path)
sourcesRoot: ".."

# Sources are expected to be found in CWD (from where the 'up' script was run) or one dir above.
# On bamboo all required sources will be pulled automatically.
# NOTE: Cluster manager in Onezone and Oneprovider will be started from the same sources
# (by default cluster_manager provided as op_worker dependency will be used).
sources:
  onezone:
    node-1:
      - oz-panel
      - oz-worker
      - cluster-manager
  oneprovider-1:
    node-1:
      - op-panel
      - op-worker
      - cluster-manager
  oneprovider-2:
    node-1:
      - op-panel
      - op-worker
      - cluster-manager

users:
  - &space_owner
    name: space_owner
    password: password
  - &user1
    name: user1
    password: password
  - &user2
    name: user2
    password: password
  - &user3
    name: user3
    password: password
  - &user4
    name: user4
    password: password

spaces:
  # NOTE: all users are members of this space so that each of them is an effective
  # user of both providers - only then is a session created for them on each provider
  - name: space_krk_par_p
    user: *space_owner
    users:
      - user: *user1
      - user: *user2
      - user: *user3
      - user: *user4
    supports:
      - provider: "oneprovider-1"
        storage_name: "s3"
        size: '10000000000'
      - provider: "oneprovider-2"
        storage_name: "s3"
        size: '10000000000'

storages:
  - s3